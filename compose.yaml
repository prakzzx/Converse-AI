
services:
  db:
    image: postgres:16
    container_name: prakati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prakati_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prakati
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
